name: ferasha

x-postgres-env: &postgres-env
  POSTGRES_DB: ${POSTGRES_DB:-ferasha}
  POSTGRES_USER: ${POSTGRES_USER:-ferasha}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ferasha_dev_password}

x-django-env: &django-env
  DJANGO_SETTINGS_MODULE: config.settings
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-insecure-dev-key-change-me}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
  DATABASE_URL: postgresql://${POSTGRES_USER:-ferasha}:${POSTGRES_PASSWORD:-ferasha_dev_password}@postgres:5432/${POSTGRES_DB:-ferasha}
  REDIS_URL: redis://redis:6379/0
  JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-insecure-dev-jwt-signing-key-change-me-in-production}
  AI_ENGINE_URL: http://ai-engine:8001
  # Where the AI worker fetches originals from (signed links in media_assets.services).
  BACKEND_INTERNAL_URL: http://backend-core:8000
  AI_ENGINE_SHARED_SECRET: ${AI_ENGINE_SHARED_SECRET:-insecure-shared-secret}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
  UNPAID_ORDER_TTL_MINUTES: ${UNPAID_ORDER_TTL_MINUTES:-30}
  RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
  RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
  RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
  GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
  GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
  # Mail: unset, development prints emails to this service's log instead of sending.
  EMAIL_BACKEND: ${EMAIL_BACKEND:-}
  EMAIL_HOST: ${EMAIL_HOST:-localhost}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-1}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Ferasha <no-reply@ferasha.com>}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment: *postgres-env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ferasha} -d ${POSTGRES_DB:-ferasha}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend-core:
    build:
      context: ./backend-core
      dockerfile: Dockerfile
    restart: unless-stopped
    environment: *django-env
    volumes:
      - ./backend-core:/app
      - media-data:/app/media
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/')\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  # Housekeeping on a timer: every 5 minutes releases the stock of orders
  # left unpaid (orders.services.expire_unpaid_orders); once a day (every
  # 288th pass, and at start) deletes expired sign-in tokens, which rotation
  # would otherwise pile up forever (flushexpiredtokens). In production, cron
  # jobs or systemd timers running the same commands replace this service.
  scheduler:
    build:
      context: ./backend-core
      dockerfile: Dockerfile
    restart: unless-stopped
    environment: *django-env
    volumes:
      - ./backend-core:/app
    depends_on:
      backend-core:
        condition: service_healthy
    command: >
      sh -c "i=0; while true; do
        python manage.py expire_unpaid_orders;
        if [ $$((i % 288)) -eq 0 ]; then python manage.py flushexpiredtokens; fi;
        i=$$((i + 1)); sleep 300; done"

  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
      target: base
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-insecure-dev-jwt-signing-key-change-me-in-production}
      BACKEND_BASE_URL: http://backend-core:8000
      AI_ENGINE_SHARED_SECRET: ${AI_ENGINE_SHARED_SECRET:-insecure-shared-secret}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./ai-engine:/app
      - media-data:/data/media
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]

  ai-worker:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
      target: base
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
      BACKEND_BASE_URL: http://backend-core:8000
      # Required by Settings validation even though the worker never verifies
      # a JWT itself - the module-level settings object refuses to build
      # without it, and the container would crash-loop on boot.
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-insecure-dev-jwt-signing-key-change-me-in-production}
      AI_ENGINE_SHARED_SECRET: ${AI_ENGINE_SHARED_SECRET:-insecure-shared-secret}
    volumes:
      - ./ai-engine:/app
      - media-data:/data/media
    depends_on:
      redis:
        condition: service_healthy
      backend-core:
        condition: service_healthy
    command: ["python", "-m", "app.worker"]
    # The image's HEALTHCHECK probes the API on :8001, which the worker does
    # not serve; inherited, it marked a working worker "unhealthy" forever.
    healthcheck:
      disable: true

  # Test-only image: the runtime target has no pytest. Behind a profile so
  # `docker compose up` never starts it; `docker compose run --rm ai-tests`
  # builds the `test` target and runs the suite.
  ai-tests:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
      target: test
    profiles: ["test"]
    environment:
      REDIS_URL: redis://redis:6379/0
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-insecure-dev-jwt-signing-key-change-me-in-production}
      AI_ENGINE_SHARED_SECRET: ${AI_ENGINE_SHARED_SECRET:-insecure-shared-secret}
      BACKEND_BASE_URL: http://backend-core:8000
    volumes:
      - ./ai-engine:/app
      # tests/test_config.py resolves the repo root as parents[2], which is `/`
      # inside this container. Without these two the compose/env consistency
      # tests skip themselves rather than run.
      - ./docker-compose.yml:/docker-compose.yml:ro
      - ./.env.example:/.env.example:ro
    command: ["pytest", "-q"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      # Read by next.config.ts rewrites and lib/api/client.ts for server-side fetches.
      BACKEND_INTERNAL_URL: http://backend-core:8000
      AI_ENGINE_URL: http://ai-engine:8001
      NEXT_TELEMETRY_DISABLED: "1"
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-}
      NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL:-http://localhost:8000/admin}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend-core
    command: ["pnpm", "dev"]

volumes:
  postgres-data:
  redis-data:
  media-data:
