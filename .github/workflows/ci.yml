name: Elite CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # 1. Linting & Static Analysis
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Backend Lint (Flake8/Black)
        run: |
          pip install flake8 black
          black --check backend-core/
          flake8 backend-core/

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Frontend Deps
        run: pnpm install

      - name: Frontend Lint & Typecheck
        run: |
          pnpm run lint
          pnpm run typecheck

  # 2. Backend Integration Tests
  backend-tests:
    needs: static-analysis
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ferasha
          POSTGRES_USER: ferasha
          POSTGRES_PASSWORD: ferasha_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
            --health-interval 10s
            --health-timeout 5s
            --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
            --health-interval 10s
            --health-timeout 5s
            --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Backend Deps
        run: |
          pip install -r backend-core/requirements.txt
          pip install pytest pytest-django

      - name: Run Backend Tests
        env:
          DATABASE_URL: postgresql://ferasha:ferasha_password@localhost:5432/ferasha
          REDIS_URL: redis://localhost:6379/0
          DJANGO_SECRET_KEY: ci-secret-key
          DJANGO_DEBUG: "1"
        run: |
          cd backend-core
          python manage.py migrate
          pytest tests/

  # 3. Frontend Unit Tests
  frontend-tests:
    needs: static-analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install Frontend Deps
        run: pnpm install
      - name: Run Frontend Tests
        run: pnpm run test
