name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend-core (ruff, migrations, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-core
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ferasha
          POSTGRES_USER: ferasha
          POSTGRES_PASSWORD: ferasha_ci_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ferasha -d ferasha"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-anywhere-else
      DATABASE_URL: postgresql://ferasha:ferasha_ci_password@localhost:5432/ferasha
      REDIS_URL: redis://localhost:6379/0
      JWT_SIGNING_KEY: ci-only-jwt-signing-key-at-least-thirty-two-bytes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # matches backend-core/Dockerfile
          cache: pip
          cache-dependency-path: backend-core/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Migrations are committed
        run: python manage.py makemigrations --check --dry-run
      - run: python manage.py collectstatic --noinput
      - run: pytest -q

  ai-engine:
    name: ai-engine (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The compose `ai-tests` service builds the Dockerfile `test` target and
      # mounts the compose file and .env.example the config tests read.
      - run: docker compose --profile test run --rm ai-tests

  frontend:
    name: frontend (typecheck, unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"  # matches frontend/Dockerfile
      # pnpm version comes from package.json "packageManager".
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # Every story renders (and its play steps pass) in real Chromium, so a
      # component change that breaks a story fails the build.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:storybook
